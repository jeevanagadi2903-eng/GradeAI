<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GradeAI – Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'DM Sans',sans-serif;background:#06060f;color:#e8e4f0;min-height:100vh;cursor:none}
        #cursor{position:fixed;width:12px;height:12px;background:#8b5cf6;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);mix-blend-mode:screen;transition:width 0.2s,height 0.2s}
        #ring{position:fixed;width:40px;height:40px;border:1.5px solid rgba(139,92,246,0.5);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%)}
        .bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.025) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
        .orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;animation:floatOrb 8s ease-in-out infinite}
        .orb1{width:400px;height:400px;background:rgba(139,92,246,0.12);top:-100px;left:-100px}
        .orb2{width:300px;height:300px;background:rgba(236,72,153,0.08);bottom:-80px;right:-80px;animation-delay:-3s}
        @keyframes floatOrb{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-20px)}}
        nav{position:relative;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:20px 48px;border-bottom:1px solid rgba(255,255,255,0.07);background:rgba(6,6,15,0.8);backdrop-filter:blur(20px)}
        .logo{font-family:'Instrument Serif',serif;font-size:22px;background:linear-gradient(135deg,#fff,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .nav-right{display:flex;align-items:center;gap:12px}
        .breadcrumb{font-size:13px;color:#5a5570;display:flex;align-items:center;gap:8px}
        .breadcrumb a{color:#a78bfa;text-decoration:none}
        .nav-btn{font-size:12px;padding:8px 16px;border-radius:8px;border:1px solid rgba(255,255,255,0.07);background:rgba(255,255,255,0.03);color:#e8e4f0;cursor:none;text-decoration:none;transition:all 0.2s}
        .nav-btn:hover{background:rgba(139,92,246,0.1)}
        .main{position:relative;z-index:5;max-width:1000px;margin:0 auto;padding:52px 48px}
        .page-header{margin-bottom:40px}
        .page-header h1{font-family:'Instrument Serif',serif;font-size:38px;letter-spacing:-1px;margin-bottom:8px}
        .page-header h1 span{font-style:italic;background:linear-gradient(135deg,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .page-header p{color:#5a5570;font-size:14px}
        .grade-card{background:rgba(13,13,26,0.95);border:1px solid rgba(255,255,255,0.07);border-radius:20px;padding:36px;position:relative;overflow:hidden;margin-bottom:48px}
        .grade-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(139,92,246,0.8),transparent)}
        .grade-card-title{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#5a5570;margin-bottom:24px}
        .fields{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px}
        .field label{display:block;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#5a5570;margin-bottom:8px}
        select{width:100%;border:1.5px solid rgba(255,255,255,0.08);border-radius:12px;padding:13px 16px;font-family:'DM Sans',sans-serif;font-size:14px;color:#e8e4f0;background:#0d0d1a;outline:none;cursor:none;transition:all 0.25s;appearance:none}
        select:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,0.1)}
        .proceed-btn{padding:15px 40px;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:none;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:white;transition:transform 0.2s,box-shadow 0.2s}
        .proceed-btn:hover{transform:translateY(-2px);box-shadow:0 20px 40px rgba(139,92,246,0.3)}
        .section-label{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#5a5570;margin-bottom:24px;display:flex;align-items:center;gap:12px}
        .section-label::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.07)}
        .subject-group{margin-bottom:32px}
        .subject-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
        .subject-name{font-family:'Instrument Serif',serif;font-size:20px}
        .subject-count{font-size:12px;padding:3px 10px;border-radius:20px;background:rgba(139,92,246,0.1);border:1px solid rgba(139,92,246,0.2);color:#a78bfa}
        .test-card{background:rgba(13,13,26,0.95);border:1px solid rgba(255,255,255,0.07);border-radius:16px;margin-bottom:12px;overflow:hidden;transition:border-color 0.2s}
        .test-card:hover{border-color:rgba(139,92,246,0.2)}
        .test-card-header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;cursor:none}
        .test-info{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
        .test-title{font-size:15px;font-weight:600}
        .test-badge{font-size:11px;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);color:#c4bdd4}
        .test-date{font-size:12px;color:#5a5570}
        .test-right{display:flex;align-items:center;gap:20px}
        .test-avg-val{font-size:18px;font-weight:700;background:linear-gradient(135deg,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .test-avg-lbl{font-size:11px;color:#5a5570;text-align:right}
        .expand-btn{font-size:18px;color:#5a5570;background:none;border:none;cursor:none;transition:transform 0.25s;padding:4px 8px}
        .expand-btn.open{transform:rotate(180deg)}
        .rankings{display:none;border-top:1px solid rgba(255,255,255,0.07)}
        .rankings.open{display:block}
        .rank-row{display:grid;grid-template-columns:52px 1fr 100px 120px;align-items:center;padding:12px 24px;border-bottom:1px solid rgba(255,255,255,0.04);font-size:13px}
        .rank-row:last-child{border-bottom:none}
        .rank-row.header{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#5a5570;padding:10px 24px;background:rgba(255,255,255,0.02)}
        .rank-num{font-weight:700;color:#5a5570}
        .rank-name{color:#c4bdd4}
        .rank-score{color:#e8e4f0;font-weight:600;text-align:right;padding-right:16px}
        .rank-bar-wrap{height:5px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden}
        .rank-bar{height:100%;background:linear-gradient(90deg,#8b5cf6,#ec4899);border-radius:3px}
        .no-tests{text-align:center;padding:48px;color:#5a5570;font-size:14px;background:rgba(13,13,26,0.95);border:1px solid rgba(255,255,255,0.07);border-radius:16px}
        .loading{text-align:center;padding:48px;color:#5a5570;font-size:14px}
    </style>
</head>
<body>
<div id="cursor"></div>
<div id="ring"></div>
<div class="bg-grid"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<nav>
    <div class="logo">GradeAI</div>
    <div class="breadcrumb">
        <a href="/classes">Home</a> › Class {{ selected_class }}{{ selected_section }}
    </div>
    <div class="nav-right">
        <a href="/students" class="nav-btn">👥 Students</a>
        <a href="/scanner-setup" class="nav-btn">📠 Scanner</a>
        <a href="/logout" class="nav-btn">Logout</a>
    </div>
</nav>

<div class="main">
    <div class="page-header">
        <h1>Class <span>{{ selected_class }}{{ selected_section }}</span></h1>
        <p>Select subject and exam type to start grading.</p>
    </div>

    <div class="grade-card">
        <div class="grade-card-title">New Grading Session</div>
        <div class="fields">
            <div class="field">
                <label>Subject</label>
                <select id="subjectSelect">
                    <option value="">-- Select Subject --</option>
                    <option>Mathematics</option>
                    <option>Science</option>
                    <option>English</option>
                    <option>Hindi</option>
                    <option>Social Studies</option>
                    <option>Physics</option>
                    <option>Chemistry</option>
                    <option>Biology</option>
                    <option>Computer Science</option>
                </select>
            </div>
            <div class="field">
                <label>Exam Type</label>
                <select id="examSelect">
                    <option value="">-- Select Exam --</option>
                    <option>Unit Test</option>
                    <option>Midterm</option>
                    <option>Annual Exam</option>
                    <option>Practice Test</option>
                </select>
            </div>
        </div>
        <button class="proceed-btn" onclick="proceed()">Start Grading →</button>
    </div>

    <div class="section-label">Past Tests</div>
    <div id="pastTests"><div class="loading">Loading past tests...</div></div>
</div>

<script>
    const cursor=document.getElementById('cursor'),ring=document.getElementById('ring');
    let mx=0,my=0,rx=0,ry=0;
    document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cursor.style.left=mx+'px';cursor.style.top=my+'px'});
    (function animate(){rx+=(mx-rx)*0.12;ry+=(my-ry)*0.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(animate)})();
    document.querySelectorAll('button,select,a').forEach(el=>{
        el.addEventListener('mouseenter',()=>{cursor.style.width='20px';cursor.style.height='20px'});
        el.addEventListener('mouseleave',()=>{cursor.style.width='12px';cursor.style.height='12px'});
    });

    const selectedClass='{{ selected_class }}';
    const selectedSection='{{ selected_section }}';

    function proceed(){
        const sub=document.getElementById('subjectSelect').value;
        const exam=document.getElementById('examSelect').value;
        if(!sub||!exam){alert('Please select subject and exam type.');return;}
        window.location.href=`/live-scan-page?class=${selectedClass}&section=${selectedSection}&exam_type=${encodeURIComponent(exam)}&subject=${encodeURIComponent(sub)}`;
    }

    function toggleRankings(uid){
        document.getElementById('rankings_'+uid).classList.toggle('open');
        document.getElementById('btn_'+uid).classList.toggle('open');
    }

    async function loadPastTests(){
        const container=document.getElementById('pastTests');
        try{
            const res=await fetch(`/past-tests?class=${selectedClass}&section=${selectedSection}`);
            const data=await res.json();
            if(!data.subjects||!Object.keys(data.subjects).length){
                container.innerHTML=`<div class="no-tests">📋 No tests graded yet for Class ${selectedClass}${selectedSection}. Start grading to see results here!</div>`;
                return;
            }
            let html='';
            for(const [subject,tests] of Object.entries(data.subjects)){
                html+=`<div class="subject-group">
                    <div class="subject-header">
                        <div class="subject-name">${subject}</div>
                        <span class="subject-count">${tests.length} test${tests.length!==1?'s':''}</span>
                    </div>`;
                tests.forEach((test,idx)=>{
                    const uid=`${subject.replace(/\s/g,'_')}_${idx}`;
                    const maxScore=test.rankings.length?Math.max(...test.rankings.map(r=>r.score)):1;
                    html+=`<div class="test-card">
                        <div class="test-card-header" onclick="toggleRankings('${uid}')">
                            <div class="test-info">
                                <div class="test-title">${test.exam_type}</div>
                                <span class="test-badge">${test.total_students} students</span>
                                <span class="test-date">📅 ${test.date}</span>
                            </div>
                            <div class="test-right">
                                <div>
                                    <div class="test-avg-val">${test.average}/${test.total_marks}</div>
                                    <div class="test-avg-lbl">Class Average</div>
                                </div>
                                <button class="expand-btn" id="btn_${uid}">▾</button>
                            </div>
                        </div>
                        <div class="rankings" id="rankings_${uid}">
                            <div class="rank-row header"><div>Rank</div><div>Student</div><div style="text-align:right;padding-right:16px">Score</div><div></div></div>
                            ${test.rankings.map((s,i)=>`
                            <div class="rank-row">
                                <div class="rank-num">${i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1)}</div>
                                <div class="rank-name">${s.name}</div>
                                <div class="rank-score">${s.score}/${test.total_marks}</div>
                                <div><div class="rank-bar-wrap"><div class="rank-bar" style="width:${Math.round((s.score/maxScore)*100)}%"></div></div></div>
                            </div>`).join('')}
                        </div>
                    </div>`;
                });
                html+='</div>';
            }
            container.innerHTML=html;
        }catch(e){
            container.innerHTML=`<div class="no-tests">Could not load past tests.</div>`;
        }
    }
    loadPastTests();
</script>
</body>
</html>
